# =============================================================================
# params/safety_limits.yaml — 安全限值（全局配置）
# =============================================================================
# 用途：定义每个输出物理量的安全范围，防止操作失误损坏设备。
#       所有通过此文件定义的限值，在生成代码时会自动插入边界检查。
#
# 注意：这里记录的是"物理量层面的限值"（如最大磁场对应最大电流），
#       与具体仪器绑定时，代码层会额外调用仪器自身的保护功能
#       （如 GS200 的 set_current_limit / set_voltage_limit）。
#
# 字段说明：
#   min              — 最小值（低于此值无物理意义或危险）
#   max              — 最大值（超过此值会损坏设备）
#   ramp_rate        — 爬升速率（物理量单位/秒，null 表示不限制）
#   output_off_on_error — 出错时是否自动关闭输出
# =============================================================================

safety_limits:
  # ---- 直流源 ----
  keithley_6221_main_field:
    min: -100.0
    max: 100.0
    ramp_rate: null
    output_off_on_error: true
    description: "Keithley 6221 控制 Z 主线圈，允许范围 -100 到 100 mA"

  main_magnetic_field:
    min: -10
    max: 10
    ramp_rate: null
    output_off_on_error: true
    description: "GS200 电流源控制主磁场，范围 -10 到 10 mA"

  # ---- 信号发生器 ----
  Z_magnetic_field:
    min: -10.0
    max: 10.0
    ramp_rate: null
    output_off_on_error: true
    description: "Z方向磁场，范围 -10 到 10 V"

  Time_sequence_2:
    min: -10.0
    max: 10.0
    ramp_rate: null
    output_off_on_error: false
    description: "预留时序信号，10V 方波"

  Pump_laser_power:
    min: 0.0
    max: 1.0
    ramp_rate: null
    output_off_on_error: true
    description: "Pump光功率 DC 电平控制，范围 0-1V"

  Probe_laser_power:
    min: 0.0
    max: 1.0
    ramp_rate: null
    output_off_on_error: true
    description: "Probe光功率 DC 电平控制，范围 0-1 V"

  # ---- Probe 激光器 ----
  probe_laser_current:
    min: 200.0
    max: 390.0
    ramp_rate: null
    output_off_on_error: false
    description: "TOPTICA DLC pro Laser 1 电流，单位 mA；另受设备实时 current-clip 限制"

  probe_laser_temperature:
    min: 19.0
    max: 21.0
    ramp_rate: null
    output_off_on_error: false
    description: "TOPTICA DLC pro Laser 1 温度，单位 °C"

  probe_laser_pzt_voltage:
    min: 0.0
    max: 140.0
    ramp_rate: null
    output_off_on_error: false
    description: "TOPTICA DLC pro Laser 1 PZT 绝对电压，对应 Scan Offset，单位 V"

  probe_laser_scan_amplitude:
    min: 0.0
    max: 50.0
    ramp_rate: null
    output_off_on_error: false
    description: "TOPTICA DLC pro Laser 1 扫描峰峰值，单位 Vpp"

  X_magnetic_field_AM:
    min: -10
    max: 10
    ramp_rate: null
    output_off_on_error: true
    description: "X方向磁场 AM 包络输出，允许负电压；当前 AW 示波器检查范围约 -2.35 到 1.34 V"

  Y_magnetic_field_AM:
    min: -10
    max: 10
    ramp_rate: null
    output_off_on_error: true
    description: "Y方向磁场 AM 包络输出，允许负电压；当前 AW 示波器检查范围约 -2.32 到 1.37 V"

  X_magnetic_field:
    min: -10.0
    max: 10.0
    ramp_rate: null
    output_off_on_error: true
    description: "X方向磁场，范围 -10-10 V"

  Y_magnetic_field:
    min: -10.0
    max: 10.0
    ramp_rate: null
    output_off_on_error: true
    description: "Y方向磁场，范围 -10-10 V"

  rf_coil:
    min: 0.0
    max: 2.0
    ramp_rate: null
    output_off_on_error: true
    description: "RF 线圈驱动 (Y方向)，MORS/T2 用。弱驱动上限 2V，大功率可能展宽谱线或烧毁线圈"

  Pump_modulation:
    min: -0.18
    max: 0.18
    ramp_rate: null
    output_off_on_error: true
    description: "Pump AOM 驱动，幅值不超过 180 mV"

  PUMP_MOD_DUTY:
    min: 1
    max: 50
    ramp_rate: null
    output_off_on_error: false
    description: "Pump 脉冲占空比 (%)，范围 1-50%，避免过大占空比导致 AOM 过热"

  Time_sequence:
    min: -10
    max: 10
    ramp_rate: null
    output_off_on_error: false
    description: "Pump 光调制信号，通过射频开关控制Pump_modulation"

  Temp_Cont:
    min: 0.0
    max: 5.0
    ramp_rate: null
    output_off_on_error: false
    description: "温度控制信号，不可随意更改"

  Heat_Control:
    min: -0.25
    max: 0.25
    ramp_rate: null
    output_off_on_error: true
    description: "加热交流信号，保守限制为当前 0.5 Vpp 波形对应的 -0.25 至 0.25 V"

  Temp_Switch:
    min: 0.0
    max: 5.0
    ramp_rate: null
    output_off_on_error: false
    description: "温度开关，5V 打开/0V 关闭，不可用 OFF 模式"

  # ---- 温控器 ----
  temperature:
    min: 20.0
    max: 130.0
    ramp_rate: 1.0
    output_off_on_error: true
    description: "铷原子 Cell 温度，范围 20-130 °C，升温速率限制 1°C/s"

  # ---- 锁相 & 示波器（只读，无输出限值） ----
  lockin_r:
    min: null
    max: null
    ramp_rate: null
    output_off_on_error: false
    description: "只读设备，无限值"

  lockin_xy:
    min: null
    max: null
    ramp_rate: null
    output_off_on_error: false
    description: "只读设备，无限值"

  scope_waveform:
    min: null
    max: null
    ramp_rate: null
    output_off_on_error: false
    description: "只读设备，无限值"
