schema_version: 2
mapping:
  keithley_6221_main_field:
    instrument: keithley_6221
    device_id: keithley_6221_4503331
    label: Keithley 6221 Z 小磁场
    description: 6221 控制 Z 方向小磁场线圈的任意波电流，单位 mA；与 GS200 主磁场线圈独立
  main_magnetic_field:
    instrument: gs200
    device_id: gs200_90z631552
    label: GS200 Z 主磁场
    source_function: CURRent
    description: 磁力仪中 Z 主磁场线圈控制，单位mA，通过电流控制磁场强度，范围-10到10mA；与 6221 小磁场线圈独立
  Z_magnetic_field:
    instrument: signal_generator
    device_id: dg4e242401288
    endpoint:
      kind: channel
      index: 1
    label: Z方向磁场
    description: 输出的大小对应着Z方向磁场强度，一般为任意波或三角波，范围0-10 V
  Time_sequence_2:
    instrument: signal_generator
    device_id: dg4e242401288
    endpoint:
      kind: channel
      index: 2
    label: 时序信号2
    description: 暂时没有用到，预留的时序信号输出通道，暂时为0VDC输出
  Pump_laser_power:
    instrument: signal_generator
    device_id: dg9q280100002
    endpoint:
      kind: channel
      index: 1
    label: Pump光功率
    description: 输出大小对应着Pump光功率，通过调节信号发生器的DC电平控制输出功率，范围0-2 V
  Probe_laser_power:
    instrument: signal_generator
    device_id: dg9q280100002
    endpoint:
      kind: channel
      index: 2
    label: Probe光功率
    description: 输出大小对应着Probe光功率，通过调节信号发生器的DC电平控制输出功率，范围0-2 V
  probe_laser:
    instrument: toptica_dlc_pro
    device_id: dlc_pro_53043
    endpoint:
      kind: laser_channel
      index: 1
    label: Probe 激光
    current_safety_key: probe_laser_current
    temperature_safety_key: probe_laser_temperature
    pzt_safety_key: probe_laser_pzt_voltage
    scan_amplitude_safety_key: probe_laser_scan_amplitude
    description: TOPTICA DLC pro Probe 激光；PZT 电压映射为 Laser 1 Scan Offset，扫描频率只读
  X_magnetic_field_AM:
    instrument: signal_generator
    device_id: dg4e231500376
    endpoint:
      kind: channel
      index: 1
    label: X方向磁场 AM
    description: 输出大小对应着X方向磁场 AM，用作外部 AM 输入
  Y_magnetic_field_AM:
    instrument: signal_generator
    device_id: dg4e231500376
    endpoint:
      kind: channel
      index: 2
    label: Y方向磁场 AM
    description: 输出大小对应着Y方向磁场 AM，用作外部 AM 输入
  X_magnetic_field:
    instrument: signal_generator
    device_id: dg4e234902522
    endpoint:
      kind: channel
      index: 1
    label: X方向磁场
    description: 输出大小对应着X方向磁场，一般为任意波，范围-10到10 V
  Y_magnetic_field:
    instrument: signal_generator
    device_id: dg4e234902522
    endpoint:
      kind: channel
      index: 2
    label: Y方向磁场
    description: 输出大小对应着Y方向磁场，一般为任意波，范围-10到10 V
  rf_coil:
    instrument: signal_generator
    device_id: dg4e234902522
    endpoint:
      kind: channel
      index: 2
    label: RF 线圈 (Y方向)
    description: RF 线圈驱动（MORS 扫频 / T2 FID 脉冲），与 Y_magnetic_field 共用同一物理通道
  Pump_modulation:
    instrument: signal_generator
    device_id: dg4e222800868
    endpoint:
      kind: channel
      index: 1
    label: Pump调制
    description: 100MHz 连续正弦波经 RF 开关与 AOM 控制 Pump 光
  Time_sequence:
    instrument: signal_generator
    device_id: dg4e222800868
    endpoint:
      kind: channel
      index: 2
    label: 时序信号
    description: 脉冲方波门控 Pump 调制 RF 信号
  Heat_Control:
    instrument: signal_generator
    device_id: dg9q271200104
    endpoint:
      kind: channel
      index: 1
    label: 加热信号
    description: 加热信号，可在 GUI 中读取和设置；写入受 safety_limits.yaml 限制
  Temp_Switch:
    instrument: signal_generator
    device_id: dg9q271200104
    endpoint:
      kind: channel
      index: 2
    label: 温度开关信号
    description: 温度开关信号，5V为打开，DC0V为关闭
  temperature:
    instrument: tec_controller
    device_id: tec103_com3
    endpoint:
      kind: channel
      index: 1
    label: Cell温度
    description: 铷原子Cell温度控制，单位摄氏度
  lockin_r:
    instrument: lockin_amplifier
    device_id: hf2_dev18246
    endpoint:
      kind: demod
      index: 0
    label: 锁相幅度 R
    description: HF2 解调器 0 幅度输出
  lockin_xy:
    instrument: lockin_amplifier
    device_id: hf2_dev18246
    endpoint:
      kind: demod
      index: 1
    label: 锁相 X/Y
    description: HF2 解调器 1 X/Y 输出
  scope_waveform:
    instrument: sds_acquisition
    device_id: sds_sdsev82x900704
    label: 示波器波形
    description: SDS 示波器波形采集
constraints:
  shared_channel_groups:
    y_field_rf:
    - Y_magnetic_field
    - rf_coil
  colocation_groups:
    z_sequence:
    - Z_magnetic_field
    - Time_sequence_2
    laser_power:
    - Pump_laser_power
    - Probe_laser_power
    xy_field:
    - X_magnetic_field
    - Y_magnetic_field
    - rf_coil
    xy_am:
    - X_magnetic_field_AM
    - Y_magnetic_field_AM
    pump_rf:
    - Pump_modulation
    - Time_sequence
    hf2_demods:
    - lockin_r
    - lockin_xy
