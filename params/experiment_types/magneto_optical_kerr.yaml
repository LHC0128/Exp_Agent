# params/experiment_types/magneto_optical_kerr.yaml
# 实验类型：磁光 Kerr 效应测量
# 此文件作为该类实验的默认参数模板。每次运行时会复制到 data/ 目录下
# 作为该次运行的参数快照，因此修改此文件不影响历史数据。

# 实验类型标识（也是 data/ 下的子目录名）
experiment_type: magneto_optical_kerr

# 默认参数
default_params:
  # 扫描参数
  scan:
    variable: main_magnetic_field    # 映射到 mapping.yaml 中的物理量名
    start: 0.0                       # mA (GS200 电流)
    stop: 10.0                       # mA
    num_points: 20
    settle_time: 0.5                 # 每点等待稳定 (s)

  # 固定参数
  fixed:
    Pump_laser_power: 1.0            # V DC
    Probe_laser_power: 1.0           # V DC
    temperature: 80.0                # °C

  # 数据采集
  acquisition:
    record: ["lockin_r", "lockin_xy"]  # 记录哪些物理量
    average_per_point: 1               # 每点平均次数

  # 实验时序
  timing:
    pre_scan_delay: 1.0              # 扫描前等待 (s)
    post_scan_delay: 0.5             # 每点设置后等待 (s)
    inter_point_delay: 0.1           # 点间额外延迟 (s)
