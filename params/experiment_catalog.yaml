experiment_descriptions:
  bell-bloom-z-field-calibration: 扫描 Z DC 与 Pump 调制/解调频率，仅采集 Demod0 R，离线拟合共振中心并标定带符号
    Hz/V。运行页按节点编辑、应用并显式重跑，完整运行共用步骤；历史分析覆盖与下一次实验设置独立。每个频点配置后关闭温控，按 SYSTEM_SETTLE_S
    稳定并采集至内存，恢复后保存；TEC 仅设 UI 目标温度。结束按最近已执行配置恢复零偏参考 Pump 脉冲与锁相，保留主场和光功率。
  z-coil-inductance-frequency-response: 固定幅度正弦线性扫频，以 SDS CH3/CH4 比较理想 DG 设定值与线圈端电压。运行页在节点内编辑参数，提供依赖检查、显式重跑、无前置安全结束和独立分步分析；历史记录保留当轮参数、频响图与模型诊断，不从单一端电压反演唯一电感。
  z-coil-current-frequency-response: 沿对数频率轴测量低端采样电阻的实际电流频响，节点内编辑并按依赖分步执行；CH1 可选，缺少有效同帧参考时按
    DG 设定幅值归一且相位不用于闭环。闭环相位要求每频至少两次有效重复；单次测量保留幅值与相位诊断。历史分析读取各自采集快照，与下一次实验参数草稿隔离。
  mx-z-current-coupling-calibration: 固定主场下逐 Z DC 先采 SDS CH3 电阻电压，再做局部 Y RF/R 共振频扫，重建实际线圈电流并标定
    Z 耦合强度；保留正反向扫描。采集按准备、激励、SDS 准备、联合扫描与安全封存拆分，完整和分步执行共用业务。每个电流点及每个频点独立关闭温控，按 SYSTEM_SETTLE_S
    稳定，读入内存后恢复温控再保存；TEC 仅写 UI 目标。离线分析按运行资格、共振拟合、实际电流/电阻电压加权标定与科学图导出分步执行，保留磁滞、重复性及失败诊断；目录覆盖只调整原有线性度阈值。运行/历史双
    Tab 在流程顶部保存、预检及完整运行，节点内编辑共享参数和分类；草稿应用后显式重跑，历史分析对象独立，等待及安全结束期间持锁。结果依据科学 success
    显示质量结论，保留原两图与逐曲线诊断。锁相型号在设备库统一选择，预检检查完整频率窗口，输入保持高阻与 DC 耦合，保存最终实际采样率。
  z-aw-current-waveform-scope-check: 比较理论或闭环冻结目标电流与 CH3 采样电阻实测电流，报告固定延迟、形状、增益、频谱、重复性和饱和诊断。运行/历史双
    Tab 提供 6 个采集、3 个独立分析节点；参数在节点内编辑，顶部保存、预检与完整运行。应用草稿后显式重跑，来源按内容哈希冻结；历史分析绑定明确目录，无额外覆盖参数。结束停止
    SDS、关闭 Z 输出，保持共同触发当前状态。
  z-aw-closed-loop-waveform-correction: 复用 XY 双列分步界面，在节点内编辑闭环来源、Scope 与迭代参数；支持谐波辨识、时域反馈和频响预加重，保留
    CH3 实际电流与 CH4 下降沿参考。应用草稿后显式重跑，每轮结束关闭 Z 并保留全部尝试；具体目录独立分步分析，无分析覆盖参数。
  mx-y-rf-sensitivity-drift: 按绝对时间间隔重复标准 Mx Y RF 子运行，超期轮依序补跑；每轮立即分析并更新灵敏度、幅度等效线宽与拟合质量趋势。运行页提供11个采集与3个父趋势分析节点，父分析无独立覆盖值，保留无效轮原因与原趋势图。
    锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。
    解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按
    SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI 目标温度。
  mx-y-rf-sensitivity: Mx 构型下仅采集 Demod0 R，使用绝对值色散拟合斜率和零 RF 的 PSD_R 测量灵敏度，并支持两种线宽定义；运行页按节点编辑参数、勾选分步执行，历史目录可独立分阶段分析。结束仅保留已执行的
    Pump 与响应配置，不下发尚未重跑的参数。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与
    AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用
    Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI
    目标温度。
  mx-z-optimal-control-rf-sensitivity: 按配置启停 GS200 主场，以 X DC 和 Y RF 偏置平衡 XY 剩磁场，并叠加
    Z 向周期最优控制；校相幅度非零时同步采集 Demod0 R/X/Y 并以 180° 成对复差分校相后测量 RF 灵敏度，校相幅度为零时保持 Y DC 补偿、扫描
    Z 控制 Burst 相位并仅测量剩磁响应。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与
    AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用
    Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI
    目标温度。 运行/历史双 Tab 提供可勾选流程与节点参数，保存和预检位于流程顶部；共享参数同步，草稿应用后显式重跑。独立分析绑定具体目录且无额外覆盖参数，保留原科学图和历史下载；结束恢复
    GS200 原态并保持 Z 控制与共同触发。
  mx-z-optimal-control-xy-rf-sensitivity: 在 Z 周期最优控制下扫描 X/Y 补偿偏置，中心一次校相后逐点测量 RF 灵敏度并生成二维地图。运行/历史双
    Tab 提供节点参数与分步会话；顶部保存、预检和完整运行，共享参数同步，草稿应用后显式重跑。分析绑定具体目录且无额外覆盖值，保留逐点诊断和历史下载；结束恢复
    GS200 原态并保持 Z 控制与共同触发，最佳点只写结果。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭
    50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s
    自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发
    UI 目标温度。
  mx-z-optimal-control-xy-noise-spectrum: 在 Z 最优控制保持开启时扫描 X/Y DC 偏置，关闭 Y RF 交流并测量
    Demod0 R 噪声谱，以指定频段 ASD 中位数寻找最低噪声点。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭
    50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s
    自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发
    UI 目标温度。 运行/历史双 Tab 提供 7 个采集与 3 个独立分析节点；参数在节点内编辑，保存、预检与完整运行位于流程顶部。共享参数同步，草稿应用后显式重跑；具体目录只覆盖噪声统计上下限，与下一次实验及默认值隔离。来源冻结并校验内容，按原
    Welch 规则保留窄带谱线、热图和最佳点；结束恢复 GS200 原态，保持 Z 与共同触发。
  mx-z-optimal-control-xy-leakage-response: 保持 Z 周期最优控制，蛇形扫描同形 X/Y 触发任意波的带符号幅度，采集
    Demod0 R，保留原质量重试与实测网格最小点规则。运行/历史双 Tab 提供 7 个采集及 3 个独立分析节点；顶部保存、预检和完整运行，节点内编辑共享参数，应用草稿后显式重跑。理论来源冻结并校验内容，分析绑定明确目录且无额外覆盖值，保留原热图、历史参数及下载。锁相按设备库选择
    HF2/MFLI 和 DAQ/Scope，输入保持高阻、DC 耦合。配置后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    只写 UI 目标。结束恢复 GS200 原态，保持 Z/XY 与共同触发当前状态。
  mx-z-optimal-control-xy-rf-phase-response: 保持 Z 周期最优控制，蛇形扫描 X/Y DC 网格，按 180° 配对顺序扫描
    Y RF Burst 相位，采集 R 并以非线性色散模型报告响应；保留历史正弦诊断，不选最佳 XY。 运行/历史双 Tab 提供 6 个采集及 3 个独立分析节点，顶部保存布局、预检和完整运行，节点内编辑共享参数；应用草稿后显式重跑。理论/闭环来源冻结并校验内容。
    分析绑定明确目录，拟合门槛覆盖与下一次实验、默认值隔离；保留三组参数图及诊断下载。锁相按设备库选择 HF2/MFLI 和 DAQ/Scope，输入保持高阻、DC
    耦合。 配置后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 只写 UI 目标。结束恢复 GS200 原态，X/Y
    归零关闭，保持 Z 与共同触发当前状态。
  mx-z-optimal-control-xyz-balance: 保持 Z 周期最优控制，以 DG4000 DC 蛇形扫描 X/Y、GS200 电流扫描 Z，采集
    Demod0 R，按 R 最小、采集最早选择实测三维网格最小点，并附逐层一维 V 形拟合工作点诊断；任一轴可用 START=STOP、POINTS=1 固定。
    运行/历史双 Tab 提供 6 个采集及 3 个独立分析节点，顶部保存布局、预检和完整运行，节点内编辑共享参数；应用草稿后显式重跑。理论来源冻结并校验内容，
    分析绑定明确目录且无额外覆盖值。锁相按设备库选择 HF2/MFLI 和 DAQ/Scope，输入保持高阻、DC 耦合。 配置后关闭温控并按 SYSTEM_SETTLE_S
    稳定，采集至内存，恢复温控后保存；TEC 只写 UI 目标。结束恢复 GS200 与运行前 X/Y 原态，保持 Z 最优控制与共同触发当前状态。
  mx-z-optimal-control-dg4000-bias-xyz-balance: 保持 Z 周期最优控制，以同一 DG4000 Z 通道 offset
    和 X/Y DC 蛇形扫描，GS200 须物理断开且不连接。同步采集 Demod X/Y/R，以原 soft-L1 复数 Bloch 平面拟合及静态 K_Z
    标定为主结果，实测 R 最小点仅作诊断。运行/历史双 Tab 提供 6 个采集与 3 个独立分析节点；顶部保存、预检和完整运行，节点内编辑参数，应用草稿后显式重跑。理论/闭环来源与独立
    Z 标定冻结并核对内容，具体目录分析无额外覆盖值。锁相按设备库选择 HF2/MFLI 和 DAQ/Scope，输入高阻、DC 耦合，按最终实际率记录。配置后关闭温控、按
    SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后写盘；TEC 只写 UI 目标。结束恢复运行前 Z、共同触发和 X/Y 通道状态，不自动施加拟合点。
  mx-y-rf-power-optimization: 蛇形扫描 Pump/Probe 光功率，保留拟合导数与零点实测斜率双排名及逐点诊断。运行/历史双 Tab
    提供 10 个采集与 3 个分析节点；参数在节点编辑，保存、预检、完整运行和任务状态位于流程顶部。共享参数同步，应用草稿后显式重跑；具体目录的分析覆盖与下一次实验及默认值隔离。每个
    R 点配置后关闭温控，按 SYSTEM_SETTLE_S 稳定，恢复温控后保存；各结束路径恢复已执行配置中的基准光功率并保持输出。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  mx-y-rf-probe-detuning-optimization: 固定 Pump，按 PZT 外层、Probe 功率内层蛇形扫描，支持固定 Probe
    单点。运行/历史双 Tab 提供 9 个采集和 2 个独立分析节点；参数在节点编辑，顶部保存、预检、完整运行和任务状态，共享值与分类同步，应用草稿后须显式重跑。历史分析覆盖按目录隔离，不写采集快照。保留双斜率灵敏度排名，不自动施加最优点。锁相按设备库选择
    HF2/MFLI 与 DAQ/Scope，输入高阻、DC 耦合，分析按最终实际率。每条记录配置后关闭温控，按 SYSTEM_SETTLE_S 稳定，读入内存并恢复温控后保存；明确不连接
    TEC。各结束路径恢复初态 PZT/扫描及已执行的光功率基准，辅助场归零关闭，保持主场与 Pump。
  mx-main-field-calibration: 运行页按节点编辑参数并分步执行，历史目录独立分阶段分析；在 Mx 构型下扫描 GS200 主场电流和 Y
    RF 频率，由离线 Lorentzian 中心拟合标定 Hz/mA 和 nT/mA。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  mx-keithley-6221-main-field-calibration: 已归档，GUI 仅保留卡片；代码位于 old/experiments/。原方案：Keithley
    6221 独占 Z 主线圈并按可配置电流轴扫描，使用可选固定电流档位，按预测中心附近的 Y RF 共振频扫标定自由斜率和截距；GS200 必须物理断开并由程序归零关闭。
    锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。
    解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按
    SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI 目标温度。
  mx-keithley-6221-optimal-control-rf-sensitivity: 已归档，GUI 仅保留卡片；代码位于 old/experiments/。原方案：使用
    6221 按 Time_sequence_2 每个外部触发输出一个周期的 Z 小磁场最优控制任意波，同时由 GS200 驱动独立的 Z 主磁场线圈，沿用 Mx
    RF 灵敏度采集与分析。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和
    DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。
    配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI 目标温度。
  mx-main-field-noise-spectrum: 已归档，GUI 仅保留卡片；代码位于 old/experiments/。原方案：固定锁相放大器解调频率为
    90 kHz，按实测标定降低 GS200 主场电流，以正控制频率轴从 Demod0 R 的二维 PSD 分离 S_beta 与 N_S1。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  mx-main-field-scope-noise-spectrum: 按主场标定外推扫描 Larmor 控制频率，保持 X/Y DC 剩磁补偿，以 SDS 自适应量程采集
    PD 原始波形。运行/历史页提供分步流程图、节点参数与独立分析，保留局部 Lorentzian 诊断及两阶段二维全局噪声分解。配置后关温控、稳定、内存采集、恢复后保存；TEC
    仅写目标温度。结束恢复 GS200 和 SDS DC 耦合，归零关闭 Z/XY，保留光路与 Pump。
  mx-z-field-calibration: 在 Mx 高主场构型下扫描 Z 直流偏置和 Y RF 频率，由离线 Lorentzian 中心拟合标定 Z 通道的
    Hz/V。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC
    耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。
    配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI 目标温度。 运行页提供可选步骤、节点参数、共享草稿与显式重跑，分步等待保持设备连接和硬件锁；独立分析按具体目录保存覆盖草稿，不改历史采集参数。
  mx-z-noise-spectrum: 已归档，GUI 仅保留卡片；代码位于 old/experiments/。原方案：在 Mx 高主场构型下扫描严格标定的
    Z 直流控制失谐，固定锁相放大器解调频率为 90 kHz，并从 Demod0 R 的二维 PSD 分离 S_beta 与 N_S1。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  mx-xy-residual-field-calibration: 在扫描主场下读取 SDS CH1 直流均值，以 X 外层、Y 同向网格及二维 Bloch/线性漂移拟合剩磁平衡点。运行/历史双
    Tab 提供可勾选依赖流程图、节点参数、草稿应用和显式重跑；独立分析绑定具体目录，无额外覆盖参数。每次量程尝试关温控、稳定、采集至内存、恢复后保存；TEC
    仅写目标温度。结束恢复 GS200，XYZ 归零关闭，不施加拟合补偿值。
  noise-spectrum-xy-v2: 已归档，GUI 仅保留卡片；代码位于 old/experiments/。原方案：测量 XY 控制条件下的噪声谱，dg_am
    作为调制信号。 锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和
    DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。
    配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发 UI 目标温度。
  photon-shot-noise: 扫描 Probe 控制电压，关闭 Pump 并偏置主场，测量同一输入的锁相 X/Y 噪声本底。运行/历史双 Tab 提供 8 个采集、3 个独立分析节点，节点改参与显式重跑，等待保持硬件锁；每条重复恢复温控后保存，TEC 仅写目标温度。保留 Welch PSD→平坦段 ASD 中位数→均值平方加权线性拟合和四组 PNG/PDF；具体目录分析草稿独立，不改历史快照。锁相型号与 DAQ/Scope 由设备库选择，频谱使用最终实际率；收尾恢复温控，保持已执行主场、Probe、Pump OFF 和锁相设置，只断开 TEC。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  projection-noise: SDS PD 自旋噪声测量，运行／历史双 Tab 与 9 采集／2 分析节点，可选 GS200 OFF 背景，保留原 Welch 与自由洛伦兹拟合。
    参数在节点编辑，草稿应用后显式重跑，具体目录分析覆盖值独立；恢复温控后保存，TEC 只写目标温度。Pump 载波／门控从初始化到所有收尾均不修改，GS200 恢复运行前状态。
  rf-sensitivity-aw-frequency: 已归档，GUI 仅保留卡片；采集代码位于 old/experiments。原方案以 dg_am 作为外部 AM 调制信号测量射频频率响应，保留 HF2 双主电压回采限制与历史数据；共用分析入口仍供 DirectAW 使用。
    锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI
    请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  rf-sensitivity-constxy-frequency: 固定 XY 外部 AM 载波与 DC 包络，扫描 Z 射频频率，保留无限 Burst／外触发；0 Hz 背景只关 Z、XY 保持开启。运行／历史双 Tab 提供 11 采集／3 分析节点，节点内编辑，顶部保存、预检及完整运行；草稿应用后显式重跑，分步等待保持输出和硬件锁。
    双主电压物理回环仅支持 HF2，MFLI 在连接前拒绝；输入高阻／DC，按最终实际率分析。每频点配置后关闭温控，按 SYSTEM_SETTLE_S 稳定，采集到内存，恢复 5 V DC + ON 后保存；TEC 只写 UI 目标温度。
    离线保留 FFT、软件锁相、硬件矢量／标量 R、原带宽及 Lorentzian／Bloch 拟合与诊断图；具体目录分析草稿隔离，不改采集快照。所有结束路径统一关闭 XY／Z、恢复温控，仅断开 TEC，保留主场、光功率、Pump／时序和锁相设置。
  rf-sensitivity-direct-aw-frequency: 测量射频频率响应，dg_am 作为触发信号，使得 dg_comp 两路同相输出。 当前双主电压回采接线只支持
    HF2，选择 MFLI 时预检禁止启动。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2
    自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  xy-direct-aw-dc-calibration: DirectAW 加常数控制的方式，外加不同频率射频场，寻找频率响应的最大值的位置，来对 控制 进行标定。
    当前双主电压回采接线只支持 HF2，选择 MFLI 时预检禁止启动。 锁相输入初始化统一关闭 50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2
    自动用 DAQ，MFLI 请求 >70 kSa/s 自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC
    可连接时仅下发 UI 目标温度。
  z-aw-waveform-scope-check: 分步配置版本化 Z 任意波与共同触发，使用 SDS CH3 测量线圈电压、CH4 记录触发；运行页按节点编辑参数和执行，历史目录独立分析固定延迟、形状相似度与幅值诊断。
  mx-y-optimal-control-rf-frequency-response: Z 向闭环冻结最优控制下，逐频率扫描 Y RF Burst 相位并取有效相位中位数；可选恒定
    Z DC 的 0° 同频段对照。运行页在依赖节点内编辑共享参数，草稿应用后显式重跑，新轮次保存独立目录；分析绑定已封存目录且无额外覆盖值，保留热图、对照曲线、标定诊断和历史填回。
    结束恢复 Z 最优控制并保留共同触发、光功率、主场和 Pump，关闭横向场。锁相设备在设备库中全系统统一选择；启动前检查输入通道和工作频率兼容性。 锁相输入初始化统一关闭
    50 Ω 与 AC 耦合，后续配置保持高阻和 DC 耦合。 解调时序复用设备库自动／DAQ／Scope：HF2 自动用 DAQ，MFLI 请求 >70 kSa/s
    自动用 Scope；频谱按最终实际率计算。 配置完成后关闭温控并按 SYSTEM_SETTLE_S 稳定，采集至内存，恢复温控后保存；TEC 可连接时仅下发
    UI 目标温度。
