experiment_descriptions:
  z-coil-inductance-frequency-response: Z 线圈固定幅度正弦扫频，比较理论设定与线圈端电压的幅值、相位和残差。
  z-coil-current-frequency-response: 通过低端采样电阻测量 DG4000 到 Z 线圈实际电流的复数频率响应，为闭环预加重和逆滤波提供可靠带宽。
  mx-z-current-coupling-calibration: 在 Mx 高主场工作点同步测量采样电阻电压和 Y RF 共振中心，标定实际线圈电流到控制耦合强度的关系。
  z-aw-current-waveform-scope-check: 比较最优控制目标电流与采样电阻实测电流，报告固定延迟、形状、增益、频谱、重复性和饱和诊断。
  z-aw-closed-loop-waveform-correction: 静态斜率闭环：电流反馈平移对齐、误差零相位低通并累加电压；理论电压预留 1.5 倍量程，导出最佳实测轮次。
  mx-y-rf-sensitivity-drift: 按固定时间间隔重复 Mx Y RF 灵敏度测量，每轮完成后立即分析并更新灵敏度与线宽趋势。
  mx-y-rf-sensitivity: Mx 构型下仅采集 Demod0 R，使用绝对值色散拟合斜率和零 RF 的 PSD_R 测量灵敏度，并支持两种线宽定义。
  mx-z-optimal-control-rf-sensitivity: 按配置启停 GS200 主场，以 X DC 和 Y RF 偏置平衡 XY 剩磁场，并叠加
    Z 向周期最优控制；校相幅度非零时同步采集 Demod0 R/X/Y 并以 180° 成对复差分校相后测量 RF 灵敏度，校相幅度为零时保持 Y DC 补偿、扫描
    Z 控制 Burst 相位并仅测量剩磁响应。
  mx-z-optimal-control-xy-rf-sensitivity: 在 Z 周期最优控制下扫描 X/Y 补偿偏置，中心一次校相后逐点测量 RF 灵敏度并生成二维地图。
  mx-z-optimal-control-xy-noise-spectrum: 在 Z 最优控制保持开启时扫描 X/Y DC 偏置，关闭 Y RF 交流并测量
    Demod0 R 噪声谱，以指定频段 ASD 中位数寻找最低噪声点。
  mx-z-optimal-control-xy-leakage-response: 保持 Z 周期最优控制，二维扫描同形 X/Y 触发任意波的带符号幅度，采集
    Demod0 R 并保留实测网格最小点。
  mx-z-optimal-control-xy-rf-phase-response: 保持 Z 周期最优控制，在 X/Y DC 平衡场网格上逐点扫描 Y RF
    Burst 相位，采集 Demod0 R 并用非线性色散模型拟合等效响应参数（保留旧正弦拟合作为对照）。
  mx-z-optimal-control-xyz-balance: 保持 Z 周期最优控制，以 DG4000 DC 扫描 X/Y、GS200 电流扫描 Z，采集
    Demod0 R 并报告实测三维网格最小点；任一轴可用 START=STOP、POINTS=1 固定。
  mx-z-optimal-control-dg4000-bias-xyz-balance: 保持 Z 周期最优控制，以同一 DG4000 Z 通道的额外 DC
    offset 扫描 Z 偏置，并扫描 X/Y，采集 Demod0 X/Y/R。
  mx-y-rf-power-optimization: 在 Mx Y 向 RF 构型下二维扫描 Pump/Probe 光功率，逐点测量完整灵敏度并按平坦频段中位数寻找最优工作点。
  mx-y-rf-probe-detuning-optimization: 在 Mx Y 向 RF 构型下固定 Pump，扫描 Probe 光功率和 DLC pro
    PZT Scan Offset；Probe 轴可设为单点。实验不连接 TEC，但保留 Temp_Switch 采集门控。
  mx-main-field-calibration: 在 Mx 构型下扫描 GS200 主场电流和 Y RF 频率，由离线 Lorentzian 中心拟合标定
    Hz/mA 和 nT/mA。
  mx-keithley-6221-main-field-calibration: Keithley 6221 独占 Z 主线圈并按可配置电流轴扫描，使用可选固定电流档位，按预测中心附近的
    Y RF 共振频扫标定自由斜率和截距；GS200 必须物理断开并由程序归零关闭。
  mx-keithley-6221-optimal-control-rf-sensitivity: 使用 6221 按 Time_sequence_2 每个外部触发输出一个周期的
    Z 小磁场最优控制任意波，同时由 GS200 驱动独立的 Z 主磁场线圈，沿用 Mx RF 灵敏度采集与分析。
  mx-main-field-noise-spectrum: 固定 HF2 为 90 kHz，按实测标定降低 GS200 主场电流，以正控制频率轴从 Demod0
    R 的二维 PSD 分离 S_beta 与 N_S1。
  mx-main-field-scope-noise-spectrum: 按主场标定外推扫描 0–50 kHz Larmor 控制频率，保持可配置的 X/Y DC
    剩磁补偿，可选 SDS AC/DC 耦合并使用自适应量程与偏置居中采集 PD 原始波形；关断后恢复 DC 耦合、归零关闭 X/Y，并使用共同 Lorentzian
    响应和秩一控制背景的二维全局拟合分离调制噪声与 N_S1。
  mx-z-field-calibration: 在 Mx 高主场构型下扫描 Z 直流偏置和 Y RF 频率，由离线 Lorentzian 中心拟合标定 Z 通道的
    Hz/V。
  mx-z-noise-spectrum: 在 Mx 高主场构型下扫描严格标定的 Z 直流控制失谐，固定 HF2 为 90 kHz，并从 Demod0 R 的二维
    PSD 分离 S_beta 与 N_S1。
  mx-xy-residual-field-calibration: 在扫描主场下直接读取 SDS CH1 平衡探测器直流均值，二维扫描 X/Y DC 补偿场并用
    Bloch 曲面拟合剩磁平衡点。
  noise-spectrum-xy: 测量 XY 控制条件下的噪声谱，dg_am 作为触发信号，使得 dg_comp 两路同相输出。
  noise-spectrum-xy-v2: 测量 XY 控制条件下的噪声谱，dg_am 作为调制信号。
  photon-shot-noise: 测量光子散粒噪声随 Probe 光功率的变化，测量锁相放大器 XY 的噪声谱本底。
  projection-noise: 采集 GS200 输出打开时的 SDS CH1 PD 原始噪声谱，可选测量输出关闭对照组，并在主场标定预测中心附近自由拟合洛伦兹自旋噪声峰。
  rf-sensitivity-aw: 测量射频灵敏度，dg_am 作为触发信号，使得 dg_comp 两路同相输出。
  rf-sensitivity-aw-frequency: 测量射频频率响应，dg_am 作为调制信号。
  rf-sensitivity-constxy-frequency: AM调制的方测量频率响应。
  rf-sensitivity-direct-aw-frequency: 测量射频频率响应，dg_am 作为触发信号，使得 dg_comp 两路同相输出。
  xy-direct-aw-dc-calibration: DirectAW 加常数控制的方式，外加不同频率射频场，寻找频率响应的最大值的位置，来对 控制 进行标定。
  z-aw-waveform-scope-check: 复用版本化 Z 最优控制波形和 Z 标定，使用 SDS CH3 测量小线圈实际电压、CH4 提供硬件触发，并离线报告允许固定时间差的波形相似度。
