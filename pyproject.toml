[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-agent"
version = "0.1.0"
description = "实验自动化平台 — 仪器控制、数据采集与分析"
requires-python = ">=3.10"
dependencies = [
  "toptica-lasersdk==3.3.0",
  "tqdm>=4.67,<5",
]

# 可按用途组合安装；基础安装继续保留已有 SDK 与进度条契约。
[project.optional-dependencies]
runtime = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "PyVISA>=1.14,<2",
  "pyserial>=3.5,<4",
]
instruments = [
  "PyVISA-py>=0.7,<1",
  "zhinst>=26.7,<27",
]
analysis = [
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
]
gui = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "pytest-xdist>=3.8,<4",
  "pytest-timeout>=2.4,<3",
]
notebook = ["jupyter>=1,<2"]

[tool.pytest.ini_options]
# 不带路径运行 pytest 时只发现仓库自有测试；虚拟环境、旧代码、第三方仪器示例和数据目录不进入发现。
testpaths = ["GUI/backend", "lab_workflows", "src", "tools"]
norecursedirs = [
  ".*", "*.egg", "*.egg-info", "_darcs", "build", "CVS", "dist", "venv", "{arch}",
  "__pycache__", "node_modules", "agent_exp_env", "old", "examples", "data", "results", "tmp",
]
# pytest-timeout：单个用例超过 300 s 视为卡死，打印线程栈后终止（Windows 只支持 thread 方式）。
timeout = 300
timeout_method = "thread"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "gs200*",
  "hardware_gate*",
  "keithley_6221*",
  "lockin_amplifier*",
  "sds_acquisition*",
  "sensitivity_analysis*",
  "signal_generator*",
  "tec_controller*",
  "toptica_laser*",
  "lab_workflows*",
]
