[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-agent"
version = "0.1.0"
description = "实验自动化平台 — 仪器控制、数据采集与分析"
requires-python = ">=3.10"
dependencies = [
  "toptica-lasersdk==3.3.0",
  "tqdm>=4.67,<5",
]

# 可按用途组合安装；基础安装继续保留已有 SDK 与进度条契约。
[project.optional-dependencies]
runtime = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "PyVISA>=1.14,<2",
  "pyserial>=3.5,<4",
]
instruments = [
  "PyVISA-py>=0.7,<1",
  "zhinst>=26.7,<27",
]
analysis = [
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
]
gui = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]
notebook = ["jupyter>=1,<2"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "gs200*",
  "keithley_6221*",
  "lockin_amplifier*",
  "sds_acquisition*",
  "sensitivity_analysis*",
  "signal_generator*",
  "tec_controller*",
  "toptica_laser*",
  "lab_workflows*",
]
