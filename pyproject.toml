[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exp-agent"
version = "0.1.0"
description = "实验自动化平台 — 仪器控制、数据采集与分析"
requires-python = ">=3.10"
dependencies = [
  "toptica-lasersdk==3.3.0",
  "tqdm>=4.67,<5",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "gs200*",
  "keithley_6221*",
  "lockin_amplifier*",
  "sds_acquisition*",
  "sensitivity_analysis*",
  "signal_generator*",
  "tec_controller*",
  "toptica_laser*",
  "lab_workflows*",
]
